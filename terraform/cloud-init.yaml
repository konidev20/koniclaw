#cloud-config

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - software-properties-common

runcmd:
  # ── Docker ──────────────────────────────────────────────────────────────────
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - bash -c 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null'
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - usermod -aG docker ${vm_admin_username}
  # ── NVM + Node LTS ──────────────────────────────────────────────────────────
  - runuser -l ${vm_admin_username} -c 'curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash'
  - runuser -l ${vm_admin_username} -c 'source $HOME/.nvm/nvm.sh && nvm install --lts'
  # ── Ansible ─────────────────────────────────────────────────────────────────
  - apt-get install -y ansible
  # ── uv ──────────────────────────────────────────────────────────────────────
  - runuser -l ${vm_admin_username} -c 'curl -LsSf https://astral.sh/uv/install.sh | sh'
